providers = ["python"]

[variables]
PLAYWRIGHT_BROWSERS_PATH = "/app/ms-playwright"

[phases.setup]
aptPkgs = [
  "libnss3",
  "libnspr4",
  "libatk1.0-0",
  "libatk-bridge2.0-0",
  "libcups2",
  "libdrm2",
  "libxkbcommon0",
  "libxcomposite1",
  "libxdamage1",
  "libxfixes3",
  "libxrandr2",
  "libgbm1",
  "libasound2",
  "libpango-1.0-0",
  "libcairo2",
  "libx11-xcb1",
  "libxshmfence1",
  "fonts-dejavu-core",
  "fonts-liberation",
]

[phases.install]
cmds = [
  "python -m pip install -r requirements.txt",
  "python -m playwright install chromium",
]
