<section class="ds-card ds-attention{% if attention_card_class %} {{ attention_card_class }}{% endif %}">
    <div class="ds-card__header">
        <h2 class="ds-card__title">{{ attention_card_title }}</h2>
        {% if attention_card_link_href %}
        <a href="{{ attention_card_link_href }}" class="ds-card__link">{{ attention_card_link_label }}</a>
        {% endif %}
    </div>
    {{ attention_card_body }}
</section>
