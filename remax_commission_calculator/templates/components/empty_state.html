<div class="ds-empty">
    <svg class="ds-empty__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="4" y="5" width="16" height="14" rx="2" stroke="currentColor" stroke-width="1.75"/>
        <path d="M8 10h8M8 14h5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
    </svg>
    <p class="ds-empty__title">{{ empty_title }}</p>
    {% if empty_description %}
    <p class="ds-empty__desc">{{ empty_description }}</p>
    {% endif %}
    {% if empty_primary_href or empty_ia_href %}
    <div class="ds-empty__actions">
        {% if empty_primary_href %}
        <a href="{{ empty_primary_href }}" class="btn btn-small btn-primary">{{ empty_primary_label }}</a>
        {% endif %}
        {% if empty_ia_href %}
        <a href="{{ empty_ia_href }}" class="btn btn-small btn-secondary">{{ empty_ia_label }}</a>
        {% endif %}
    </div>
    {% endif %}
</div>
