<aside class="auth-brand-panel" aria-label="{{ brand_name }}">
    <div class="auth-brand-panel-inner">
        <img
            src="{{ brand_logo_full_url }}"
            alt="{{ brand_name }}"
            class="auth-brand-panel-logo"
        >
        <p class="auth-brand-panel-name">{{ brand_name }}</p>
        <p class="auth-brand-panel-tagline">{{ t('app_slogan') }}</p>
    </div>
</aside>
