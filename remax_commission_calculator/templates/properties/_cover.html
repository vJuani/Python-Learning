{% if src %}
<img
    class="property-cover {{ modifier or '' }}"
    src="{{ src }}"
    alt="{{ t('property_photo_alt') }}"
    loading="lazy"
    decoding="async"
    referrerpolicy="no-referrer"
    data-media-url="{{ src }}"
    data-media-fallback
    data-fallback-label="{{ t('property_no_synced_photos') }}"
    onerror="window.__jrhMediaFallback && window.__jrhMediaFallback(this)"
>
{% else %}
<span class="property-media-placeholder {{ modifier or '' }}" title="{{ t('property_no_synced_photos') }}" aria-label="{{ t('property_no_synced_photos') }}">
    <span class="property-media-placeholder__icon" aria-hidden="true"></span>
    <span class="property-media-placeholder__label">{{ t('property_no_synced_photos') }}</span>
</span>
{% endif %}
