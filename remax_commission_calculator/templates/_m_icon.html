{# Inline SVG icons for mobile tiles. Keep strokes consistent. #}
{% set name = icon|default('ops') %}
<svg class="m-tile__svg" viewBox="0 0 24 24" fill="none" aria-hidden="true">
{% if name == 'ops' %}
    <path d="M8 7h12M8 12h12M8 17h12" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
    <circle cx="4.5" cy="7" r="1" fill="currentColor"/>
    <circle cx="4.5" cy="12" r="1" fill="currentColor"/>
    <circle cx="4.5" cy="17" r="1" fill="currentColor"/>
{% elif name == 'billing' %}
    <path d="M7 3h10v18H7z" stroke="currentColor" stroke-width="1.75"/>
    <path d="M9 8h6M9 12h6M9 16h4" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
{% elif name == 'reports' %}
    <path d="M5 19V9M12 19V5M19 19v-7" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
{% elif name == 'properties' %}
    <path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5Z" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
{% elif name == 'cash' %}
    <rect x="3" y="7" width="18" height="12" rx="2" stroke="currentColor" stroke-width="1.75"/>
    <path d="M3 10h18M12 13v3" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
{% elif name == 'agents' %}
    <circle cx="8" cy="9" r="2.5" stroke="currentColor" stroke-width="1.75"/>
    <circle cx="16" cy="9" r="2.5" stroke="currentColor" stroke-width="1.75"/>
    <path d="M3 19c0-2.8 2.2-5 5-5s5 2.2 5 5M13 19c.4-2.2 2-4 4-4 1.2 0 2.3.5 3 1.2" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
{% elif name == 'agenda' %}
    <rect x="4" y="5" width="16" height="15" rx="2" stroke="currentColor" stroke-width="1.75"/>
    <path d="M4 10h16M9 3v4M15 3v4" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
{% elif name == 'contacts' %}
    <circle cx="9" cy="8" r="3" stroke="currentColor" stroke-width="1.75"/>
    <path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 8h5M18.5 5.5v5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
{% elif name == 'jrh' %}
    <path d="M12 4v3M12 17v3M4 12h3M17 12h3" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
    <circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="1.75"/>
{% elif name == 'marketing' %}
    <path d="M5 10v4l12-6v12L5 14" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
{% elif name == 'settings' %}
    <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.75"/>
    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
{% elif name == 'help' %}
    <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.75"/>
    <path d="M9.5 9.5a2.5 2.5 0 1 1 3.6 2.2c-.7.4-1.1.9-1.1 1.8V14" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
    <circle cx="12" cy="17" r="0.8" fill="currentColor"/>
{% else %}
    <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.75"/>
{% endif %}
</svg>
