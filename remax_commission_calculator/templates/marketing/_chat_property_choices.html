{% set choices = (message.metadata or {}).get('property_choices') or [] %}
{% set pending = (message.metadata or {}).get('pending_prompt') or '' %}
<div class="mkt-choices">
    {% for item in choices %}
    <form method="post" action="{{ send_action }}" class="mkt-choices__form">
        {% if conversation %}
        <input type="hidden" name="conversation_id" value="{{ conversation.id }}">
        {% endif %}
        <input type="hidden" name="prompt" value="{{ pending }}">
        <input type="hidden" name="property_id" value="{{ item.id }}">
        <button type="submit" class="mkt-choices__card">
            {% if item.cover_url %}
            <img src="{{ item.cover_url }}" alt="">
            {% else %}
            <span class="mkt-choices__ph" aria-hidden="true"></span>
            {% endif %}
            <span class="mkt-choices__copy">
                <strong>{{ item.address }}</strong>
                <small>
                    {% if item.rooms %}{{ item.rooms }} amb{% endif %}
                    {% if item.listing_price is not none %}
                        {% if item.rooms %} · {% endif %}{{ item.listing_price|listing_money(item.listing_currency) }}
                    {% endif %}
                </small>
                <em>{{ item.locality }}</em>
            </span>
        </button>
    </form>
    {% endfor %}
</div>
