{% extends "email/base.html" %}

{% block content %}
  <h1 style="margin:0 0 12px 0;font-size:22px;line-height:1.3;font-weight:700;color:#111827;text-align:center;">
    {{ title }}
  </h1>
  <p style="margin:0 0 28px 0;font-size:15px;line-height:1.6;color:#4b5563;text-align:center;">
    {{ intro }}
  </p>

  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin:0 0 28px 0;">
    <tr>
      <td align="center" style="background-color:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;padding:22px 16px;">
        <p style="margin:0;font-size:32px;line-height:1.2;letter-spacing:0.35em;font-weight:700;color:#111827;font-family:'SF Mono',Consolas,'Liberation Mono',Menlo,monospace;">
          {% for digit in code_digits %}{{ digit }}{% if not loop.last %}<span style="display:inline-block;width:0.2em;">&nbsp;</span>{% endif %}{% endfor %}
        </p>
      </td>
    </tr>
  </table>

  <p style="margin:0 0 12px 0;font-size:14px;line-height:1.6;color:#6b7280;text-align:center;">
    {{ expiry_text }}
  </p>
  <p style="margin:0;font-size:13px;line-height:1.6;color:#9ca3af;text-align:center;">
    {{ ignore_text }}
  </p>
{% endblock %}
