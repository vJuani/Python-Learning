{% extends "email/base.html" %}

{% block content %}
  <h1 style="margin:0 0 12px 0;font-size:22px;line-height:1.3;font-weight:700;color:#111827;text-align:center;">
    {{ title }}
  </h1>
  {% if greeting %}
  <p style="margin:0 0 12px 0;font-size:15px;line-height:1.6;color:#4b5563;text-align:center;">
    {{ greeting }}
  </p>
  {% endif %}
  <p style="margin:0 0 20px 0;font-size:15px;line-height:1.6;color:#4b5563;text-align:center;">
    {{ body_text }}
  </p>
  {% if reason %}
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin:0 0 8px 0;">
    <tr>
      <td style="background-color:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;padding:16px 18px;">
        <p style="margin:0 0 6px 0;font-size:12px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:#6b7280;">
          {{ reason_label }}
        </p>
        <p style="margin:0;font-size:14px;line-height:1.6;color:#374151;">
          {{ reason }}
        </p>
      </td>
    </tr>
  </table>
  {% endif %}
{% endblock %}
