<!DOCTYPE html>
<html lang="{{ language|default('es') }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{{ subject }}</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
</head>
<body style="margin:0;padding:0;background-color:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2937;-webkit-font-smoothing:antialiased;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#f4f5f7;margin:0;padding:0;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width:560px;background-color:#ffffff;border-radius:12px;border:1px solid #e5e7eb;overflow:hidden;">
          <tr>
            <td style="padding:28px 32px 12px 32px;text-align:center;">
              {% if logo_url %}
              <img
                src="{{ logo_url }}"
                alt="{{ brand_name }}"
                width="180"
                style="display:block;margin:0 auto 10px auto;max-width:180px;height:auto;border:0;outline:none;text-decoration:none;"
              >
              {% else %}
              <p style="margin:0;font-size:15px;letter-spacing:0.04em;text-transform:uppercase;color:#001838;font-weight:700;">
                {{ brand_name }}
              </p>
              {% endif %}
              <p style="margin:8px 0 0 0;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:#6b7280;font-weight:500;">
                {{ footer_tagline }}
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:8px 32px 32px 32px;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px 28px 32px;border-top:1px solid #f3f4f6;text-align:center;">
              <p style="margin:0 0 4px 0;font-size:13px;font-weight:600;color:#001838;">
                {{ brand_name }}
              </p>
              <p style="margin:0;font-size:12px;line-height:1.5;color:#9ca3af;">
                {{ footer_tagline }}
              </p>
            </td>
          </tr>
        </table>
        <p style="margin:16px 0 0 0;font-size:11px;color:#9ca3af;">
          &nbsp;
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
