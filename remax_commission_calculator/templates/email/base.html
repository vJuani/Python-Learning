<!DOCTYPE html>
<html lang="{{ language|default('es') }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background-color:#f2f4f8;font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#0a1633;-webkit-font-smoothing:antialiased;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#f2f4f8;margin:0;padding:0;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width:560px;background-color:#ffffff;border-radius:12px;border:1px solid #d5dde8;overflow:hidden;box-shadow:0 4px 24px rgba(10,22,51,0.06);">
          <tr>
            <td style="padding:24px 32px 16px 32px;text-align:center;background:linear-gradient(180deg,#0a1633 0%,#111f3d 100%);">
              {% if logo_url %}
              <img
                src="{{ logo_url }}"
                alt="{{ brand_name }}"
                width="160"
                style="display:block;margin:0 auto 8px auto;max-width:160px;height:auto;border:0;outline:none;text-decoration:none;border-radius:6px;"
              >
              {% else %}
              <p style="margin:0;font-size:16px;letter-spacing:0.08em;text-transform:uppercase;color:#ffffff;font-weight:700;">
                {{ brand_name }}
              </p>
              {% endif %}
              <p style="margin:6px 0 0 0;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.65);font-weight:500;">
                {{ footer_tagline }}
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:28px 32px 32px 32px;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px 24px 32px;border-top:1px solid #e4eaf2;text-align:center;background:#f8fafc;">
              {% if email_footer_image_url %}
              <img
                src="{{ email_footer_image_url }}"
                alt="{{ brand_name }}"
                width="200"
                style="display:block;margin:0 auto 12px auto;max-width:200px;height:auto;border:0;outline:none;text-decoration:none;"
              >
              {% endif %}
              <p style="margin:0 0 6px 0;font-size:13px;font-weight:600;color:#0a1633;">
                {{ brand_name }}
              </p>
              <p style="margin:0 0 8px 0;font-size:12px;line-height:1.5;color:#33415c;">
                {{ footer_tagline }}
              </p>
              <p style="margin:0;font-size:11px;color:#6b7a90;">
                soporte@{{ brand_domain|default('jrhone.com') }}
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
