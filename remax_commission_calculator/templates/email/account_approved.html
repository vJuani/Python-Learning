{% extends "email/base.html" %}

{% block content %}
  <h1 style="margin:0 0 12px 0;font-size:22px;line-height:1.3;font-weight:700;color:#0a1633;text-align:center;font-family:'Poppins',Arial,sans-serif;">
    {{ title }}
  </h1>
  {% if greeting %}
  <p style="margin:0 0 12px 0;font-size:15px;line-height:1.6;color:#33415c;text-align:center;font-family:'Poppins',Arial,sans-serif;">
    {{ greeting }}
  </p>
  {% endif %}
  <p style="margin:0 0 12px 0;font-size:15px;line-height:1.6;color:#33415c;text-align:center;font-family:'Poppins',Arial,sans-serif;">
    {{ body_text }}
  </p>
  {% if organization_name %}
  <p style="margin:0 0 28px 0;font-size:14px;line-height:1.6;color:#33415c;text-align:center;font-family:'Poppins',Arial,sans-serif;">
    {{ organization_label }} <strong style="color:#0a1633;">{{ organization_name }}</strong>
  </p>
  {% else %}
  <div style="height:16px;line-height:16px;">&nbsp;</div>
  {% endif %}

  <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" style="margin:0 auto 8px auto;">
    <tr>
      <td align="center" bgcolor="#0d47ff" style="border-radius:8px;background-color:#0d47ff;">
        <a href="{{ cta_url }}" style="display:inline-block;padding:12px 28px;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:8px;font-family:'Poppins',Arial,sans-serif;">
          {{ cta_label }}
        </a>
      </td>
    </tr>
  </table>
  <p style="margin:16px 0 0 0;font-size:12px;line-height:1.5;color:#6b7a90;text-align:center;word-break:break-all;font-family:'Poppins',Arial,sans-serif;">
    {{ cta_url }}
  </p>
{% endblock %}
