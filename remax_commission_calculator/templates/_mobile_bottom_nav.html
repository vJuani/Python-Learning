{# Mobile bottom navigation — visible only under 769px via CSS. #}
{% if current_user or guest_access %}
<nav class="mobile-bottom-nav" aria-label="{{ t('mobile_bottom_nav_aria') }}">
    <a
        href="{{ url_for('dashboard') }}"
        class="mobile-bottom-nav-item{% if request.endpoint == 'dashboard' %} active{% endif %}"
    >
        <span class="mobile-bottom-nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
                <path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5Z" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
            </svg>
        </span>
        <span class="mobile-bottom-nav-label">{{ t('nav_home_short') }}</span>
    </a>
    <a
        href="{{ url_for('properties_list') }}"
        class="mobile-bottom-nav-item{% if request.endpoint and request.endpoint.startswith('properties_') %} active{% endif %}"
    >
        <span class="mobile-bottom-nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
                <path d="M4 20V9.5L12 4l8 5.5V20H4Z" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
                <path d="M10 20v-6h4v6" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
            </svg>
        </span>
        <span class="mobile-bottom-nav-label">{{ t('nav_properties') }}</span>
    </a>
    <a
        href="{{ url_for('operations_list') }}"
        class="mobile-bottom-nav-item{% if request.endpoint and request.endpoint.startswith('operations_') %} active{% endif %}"
    >
        <span class="mobile-bottom-nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
                <path d="M8 7h12M8 12h12M8 17h12" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
                <circle cx="4.5" cy="7" r="1" fill="currentColor"/>
                <circle cx="4.5" cy="12" r="1" fill="currentColor"/>
                <circle cx="4.5" cy="17" r="1" fill="currentColor"/>
            </svg>
        </span>
        <span class="mobile-bottom-nav-label">{{ t('nav_operations') }}</span>
    </a>
    {% if is_admin() %}
    <a
        href="{{ url_for('agents_list') }}"
        class="mobile-bottom-nav-item{% if request.endpoint and request.endpoint.startswith('agents_') %} active{% endif %}"
    >
        <span class="mobile-bottom-nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
                <path d="M16 11a3.5 3.5 0 1 0-3.5-3.5A3.5 3.5 0 0 0 16 11Zm-8 0a3.5 3.5 0 1 0-3.5-3.5A3.5 3.5 0 0 0 8 11Z" stroke="currentColor" stroke-width="1.75"/>
                <path d="M2.5 19a5 5 0 0 1 9 0M12.5 19a5 5 0 0 1 9 0" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
            </svg>
        </span>
        <span class="mobile-bottom-nav-label">{{ t('nav_agents') }}</span>
    </a>
    {% else %}
    <a
        href="{{ url_for('vat_calculator') }}"
        class="mobile-bottom-nav-item{% if request.endpoint == 'vat_calculator' %} active{% endif %}"
    >
        <span class="mobile-bottom-nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
                <rect x="4" y="3" width="16" height="18" rx="2" stroke="currentColor" stroke-width="1.75"/>
                <path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
            </svg>
        </span>
        <span class="mobile-bottom-nav-label">{{ t('nav_vat_calculator') }}</span>
    </a>
    {% endif %}
</nav>
{% endif %}
