<dialog id="visit-close-sheet" class="visit-close" aria-labelledby="visit-close-title">
    <form method="post" data-visit-close-form>
        <header class="visit-close__header">
            <h2 id="visit-close-title">{{ t('visit_close_title') }}</h2>
            <p class="visit-close__who" data-visit-close-label></p>
            <p class="visit-close__lead">{{ t('visit_close_lead') }}</p>
        </header>
        <div class="visit-close__body">
            {% include "agenda/_visit_close_fields.html" %}
        </div>
        <div class="visit-close__actions">
            <button type="button" class="btn btn-secondary" data-visit-close-cancel>{{ t('cancel') }}</button>
            <button type="submit" class="btn btn-primary">{{ t('visit_close_submit') }}</button>
        </div>
    </form>
</dialog>
